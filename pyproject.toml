[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lora-surgeon"
version = "0.1.0"
description = "CPU-native GGUF & Safetensors LoRA weight surgery in O(d*r^2) via Thin QR-SVD and Frobenius-orthogonal continual de-forgetting."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "duy232633786-dot" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "gguf>=0.10.0",
    "safetensors>=0.4.0",
]
keywords = ["lora", "gguf", "llama-cpp", "model-merging", "task-arithmetic", "continual-learning", "svd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/duy232633786-dot/lora-surgeon"
Repository = "https://github.com/duy232633786-dot/lora-surgeon"
Issues = "https://github.com/duy232633786-dot/lora-surgeon/issues"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
lora-surgeon = "lora_surgeon:main"

[tool.setuptools]
py-modules = ["lora_surgeon"]

[tool.pytest.ini_options]
pythonpath = ["."]
