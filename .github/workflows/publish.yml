name: Publish to PyPI

# Runs when a GitHub Release is published. Uses PyPI Trusted Publishing (OIDC), so no API token is stored.
# One-time setup on pypi.org: Account -> Publishing -> "Add a new pending publisher" with
#   PyPI project name: lora-surgeon | Owner: duy232633786-dot | Repository: lora-surgeon
#   Workflow name: publish.yml      | Environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before building
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python lora_surgeon.py --self-test
          pytest -q
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/lora-surgeon
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
